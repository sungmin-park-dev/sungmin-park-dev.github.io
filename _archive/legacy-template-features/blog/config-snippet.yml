# Merge these named sections into _config.yml.
paginate: 10

plugins:
  - jekyll-feed
  - jekyll-paginate

comments:
  provider: utterances
  utterances:
    repo: sungmin-park-dev/sungmin-park-dev.github.io
    issue_term: pathname

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false

# Restore in Gemfile, then refresh Gemfile.lock.
